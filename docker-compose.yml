services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: infinite_canvas
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data/upload:/data/upload
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: "123456"
      DB_NAME: infinite_canvas
      # 同域反代，留空即可；前台请求 /app，管理端请求 /api
      API_BASE_URL: ""
      UPLOAD_DIR: /data/upload
      DB_SYNC: "true"
      DB_INIT: "true"
      REGISTER_GIFT_POINTS: "100"
      MAX_CONCURRENT_TASKS: "3"
      MAX_UPLOAD_BYTES: "20971520"
      TASK_TIMEOUT_MS: "600000"
      TEMP_FILE_TTL_HOURS: "24"
      SECRETS_MASTER_KEY: infinite-canvas-dev-master-key-change-me!!
      # ANALYTICS_GA4_ID: G-XXXXXXXXXX
      # ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx
